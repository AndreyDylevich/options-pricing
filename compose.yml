# Запуск всего проекта одной командой:
#
#     docker compose up
#
# Дальше http://localhost:8000. Ни Python, ни PostgreSQL ставить не надо,
# .env не нужен — всё необходимое задано здесь.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pricing
    # Пароль простой намеренно: база видна только внутри сети compose и
    # наружу не проброшена. Порт 5432 не публикуем ещё и поэтому — чтобы
    # контейнер не конфликтовал с PostgreSQL, уже стоящим на машине.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Приложение первым делом накатывает миграции, и стартовать раньше
      # готовности базы ему нельзя. Обычного depends_on мало: он ждёт
      # запуска контейнера, а не готовности сервера принимать запросы.
      test: ["CMD-SHELL", "pg_isready -U postgres -d pricing"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      # Хост `db` — имя сервиса выше, compose сам заводит для него DNS.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/pricing
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Именованный том: данные переживают `docker compose down`. Чтобы
  # начать с чистой базы — `docker compose down -v`.
  pgdata:
