# Настройка линтера. Запуск:
#
#     ruff check .          найти проблемы
#     ruff check . --fix    исправить то, что исправляется однозначно
#     ruff format .         причесать форматирование

line-length = 88
target-version = "py312"

exclude = ["app/static/vendor"]

[lint]
select = [
    "E",      # pycodestyle: отступы, пробелы, длина строк
    "F",      # pyflakes: мёртвые импорты, неиспользуемые переменные, опечатки в именах
    "I",      # isort: порядок импортов
    "UP",     # pyupgrade: конструкции, устаревшие для нашей версии Python
    "B",      # bugbear: настоящие ловушки, вроде изменяемого значения по умолчанию
    "C4",     # лишние промежуточные списки в comprehension
    "SIM",    # очевидные упрощения
    "RUF",    # правила самого ruff
]

ignore = [
    # Длинные строки ловит E501, но в сообщениях об ошибках и в комментариях
    # перенос иногда вреден: разрывать русский текст по 88 символов ради
    # правила читаемости не добавляет. Следим за длиной кода, не текста.
    "E501",

    # Кириллица в строках, докстроках и комментариях. Эти правила ищут
    # буквы, похожие на латинские, — защита от подмены символа в
    # англоязычном коде. Проект русскоязычный по требованию, и здесь они
    # дают 722 жалобы на обычный текст.
    "RUF001",
    "RUF002",
    "RUF003",

    # Depends(...) и Query(...) значением по умолчанию — как устроен сам
    # FastAPI. B008 запрещает вызовы в значениях по умолчанию, но здесь
    # это требование библиотеки, а не недосмотр.
    "B008",
]

[lint.per-file-ignores]
# Миграции генерирует Alembic, и его шаблон кладёт импорты по-своему.
# Переставлять их руками в каждой — лишняя работа без выигрыша.
"alembic/versions/*" = ["I001"]

# В тестах импорт внутри функции — осознанный приём: так видно, что именно
# тест берёт из приложения, и подмена monkeypatch не задевает другие тесты.
"tests/*" = ["PLC0415"]
